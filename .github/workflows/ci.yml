name: Build APK

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "zulu"
          java-version: "17"
          cache: gradle

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: app-debug.apk
          path: ./app/build/outputs/apk/debug/app-debug.apk

  build-release:
    # Only master gets the signing and provider secrets: other branches would upload an APK
    # carrying them as an artifact. Pull requests don't get secrets anyway.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    name: Build signed release APK
    runs-on: ubuntu-latest

    env:
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      KEYSTORE_BASE_64: ${{ secrets.KEYSTORE_BASE_64 }}
      # Provider credentials; without them Genius and PetitLyrics are hidden in the app
      PROVIDER_GENIUS_TOKEN: ${{ secrets.PROVIDER_GENIUS_TOKEN }}
      PROVIDER_PETITLYRICS_CLIENT_ID: ${{ secrets.PROVIDER_PETITLYRICS_CLIENT_ID }}

    permissions:
      # Write is needed to create the tag and GitHub Release
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Read version
        id: version
        run: |
          name=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Building version $name"

      - name: Is this a new version?
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released: building only. Bump versionName to publish a new release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$tag has no release yet: it will be published."
          fi

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "zulu"
          java-version: "17"
          cache: gradle

      - name: Set up signing key
        run: |
          if [ -z "$KEYSTORE_BASE_64" ]; then
            echo "::error::The KEYSTORE_BASE_64 secret is not set."
            exit 1
          fi
          base64 -d <<< "$KEYSTORE_BASE_64" > release.keystore
          echo "RELEASE_STORE_FILE=$(realpath release.keystore)" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Name the APK after the version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SongSyncPlus-${{ steps.version.outputs.name }}.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: SongSyncPlus-${{ steps.version.outputs.name }}.apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Creates the tag on this commit as well as the release
          gh release create "${{ steps.release.outputs.tag }}" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "SongSync+ ${{ steps.version.outputs.name }}" \
            --generate-notes
