[versions]
accompanist-permissions = "0.37.3"
agp = "9.1.1"
coil-compose = "2.7.0"
haze = "1.7.3"
kotlin = "2.3.21"
core-ktx = "1.17.0"
material3 = "1.5.0-rc01"
kotlinx-coroutines-android = "1.8.1"
kotlinx-serialization-json = "1.10.0"
lifecycle-runtime-ktx = "2.9.4"
activity-compose = "1.12.4"
compose-bom = "2026.09.00"
navigation-compose = "2.9.8"
navigation-runtime-ktx = "2.9.8"
preference = "1.2.1"
ktor = "2.3.6"
datastore = "1.1.1"
taglib = "1.0.0-alpha18"
kotlin-onetimepassword = "2.4.1"
junit = "4.13.2"
kotest = "5.9.1"
robolectric = "4.14.1"
mockk = "1.13.12"
turbine = "1.1.0"
# Same OkHttp version Coil 2.7 pulls in
okhttp = "4.12.0"

[libraries]
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist-permissions" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil-compose" }
# Backdrop blur for the frosted floating controls (1.7.x: Kotlin 2.3 / Compose 1.12; 2.x needs Kotlin 2.4)
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-materials = { module = "dev.chrisbanes.haze:haze-materials", version.ref = "haze" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines-android" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle-runtime-ktx" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
ui = { group = "androidx.compose.ui", name = "ui" }
ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-navigation-runtime-ktx = { group = "androidx.navigation", name = "navigation-runtime-ktx", version.ref = "navigation-runtime-ktx" }
androidx-preference = { group = "androidx.preference", name = "preference-ktx", version.ref = "preference" }
ktor-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
# OkHttp engine: supports HTTP and SOCKS proxies (CIO only HTTP), and OkHttp is already here via Coil
ktor-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
taglib = { group = "com.github.Kyant0", name = "taglib", version.ref = "taglib" }
kotlin-onetimepassword = { group = "dev.turingcomplete", name = "kotlin-onetimepassword", version.ref = "kotlin-onetimepassword" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines-android" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[bundles]
unit-test = ["junit", "kotest-assertions-core", "mockk", "turbine", "kotlinx-coroutines-test", "ktor-client-mock", "okhttp-mockwebserver"]
